<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Black circle base — the "ocean" -->
  <circle cx="16" cy="16" r="16" fill="#050505"/>
  
  <!-- Globe grid lines cut through as transparent gaps (clipped by circle) -->
  <!-- Equator line -->
  <line x1="0" y1="16" x2="32" y2="16" stroke="#F7F7F6" stroke-width="1.4" opacity="0.25"/>
  <!-- Prime meridian -->
  <line x1="16" y1="0" x2="16" y2="32" stroke="#F7F7F6" stroke-width="1.4" opacity="0.25"/>
  
  <!-- Latitude lines -->
  <line x1="2.5" y1="9" x2="29.5" y2="9" stroke="#F7F7F6" stroke-width="1" opacity="0.15"/>
  <line x1="2.5" y1="23" x2="29.5" y2="23" stroke="#F7F7F6" stroke-width="1" opacity="0.15"/>
  
  <!-- Longitude curves (ellipses) -->
  <ellipse cx="16" cy="16" rx="7" ry="16" stroke="#F7F7F6" stroke-width="1.4" fill="none" opacity="0.2"/>
  <ellipse cx="16" cy="16" rx="16" ry="6" stroke="#F7F7F6" stroke-width="1.2" fill="none" opacity="0.2"/>
  
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="15" stroke="#F7F7F6" stroke-width="1.8" fill="none" opacity="0.4"/>
  
  <!-- Continents (simplified landmasses as filled paths with transparent feel) -->
  <!-- North America -->
  <path d="M7 8 L9 7 L12 8 L11 12 L8 13 L6 11 Z" fill="#F7F7F6" opacity="0.85"/>
  <!-- Europe + Africa combined -->
  <path d="M14 6 L18 7 L19 11 L18 16 L16 20 L14 22 L13 18 L14 13 L13 10 Z" fill="#F7F7F6" opacity="0.85"/>
  <!-- Asia -->
  <path d="M19 7 L25 8 L27 11 L24 14 L21 13 L20 10 Z" fill="#F7F7F6" opacity="0.85"/>
  <!-- South America -->
  <path d="M9 16 L12 15 L13 20 L11 25 L8 24 L7 19 Z" fill="#F7F7F6" opacity="0.85"/>
  <!-- Australia -->
  <path d="M22 19 L26 18 L27 21 L24 23 L21 22 Z" fill="#F7F7F6" opacity="0.85"/>
</svg>
