<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="cut" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d"/>
<feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="edge"/>
<feGaussianBlur in="d" stdDeviation="7" result="b"/><feOffset in="b" dy="9" result="o"/>
<feFlood flood-color="#1c1835" flood-opacity=".24"/><feComposite in2="o" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="solG" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>
<linearGradient id="solRay" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb52e"/><stop offset="1" stop-color="#ffd86b"/></linearGradient>
</defs>
<style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:256px 400px}
.bob-fast{animation:bob 1.4s ease-in-out infinite}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:wave 1.1s ease-in-out infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle-slow{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin-slow{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.tear{animation:tear 1.2s ease-in infinite}
.zz{animation:zz 2.4s ease-in-out infinite}
.steam{animation:steam 2s ease-in-out infinite}
.flicker{animation:flicker .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.flip{animation:flip 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
.pop{animation:popin 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.push{animation:push 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.shake{animation:shake .32s linear infinite}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.speed{animation:speed .6s linear infinite}
.drip{animation:drip 1.6s ease-in infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.86) rotate(0);opacity:.85}50%{transform:scale(1.1) rotate(12deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tear{0%{stroke-dasharray:0 200;opacity:0}20%{opacity:.95}100%{stroke-dasharray:90 200;opacity:.2}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-12px);opacity:1}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes flicker{to{transform:scaleY(1.08) skewX(-3deg)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
@keyframes popin{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes push{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes speed{0%{transform:translateX(18px);opacity:0}30%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g filter="url(#cut)"><g class="bob"><g stroke="#c9d3e6" stroke-width="9" stroke-linecap="round" class="speed"><path d="M170 170 h-70"/><path d="M180 204 h-90"/><path d="M170 238 h-60"/></g><g transform="translate(292 222) rotate(8) scale(1.092)"><g transform="translate(-96 30) rotate(150)"><g transform="scale(1 -1)"><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g transform="translate(96 30) rotate(-15)"><g transform=""><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g class="spin-slow"><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(0)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(30)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(60)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(90)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(120)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(150)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(180)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(210)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(240)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(270)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(300)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(330)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/></g><circle r="100" fill="url(#solG)"/><circle r="97" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-dasharray="120 500" stroke-dashoffset="-330"/>
<ellipse cx="-44" cy="-56" rx="30" ry="15" fill="#fff" opacity=".75" transform="rotate(-35 -44 -56)"/><circle cx="-12" cy="-80" r="6" fill="#fff" opacity=".7"/><g transform="translate(0 0)"><path d="M-51 -32 Q-38 -42 -25 -32" fill="none" stroke="#2a2433" stroke-width="6" stroke-linecap="round"/><path d="M25 -32 Q38 -42 51 -32" fill="none" stroke="#2a2433" stroke-width="6" stroke-linecap="round"/><g class="blink"><ellipse cx="-38" cy="0" rx="12" ry="16" fill="#2a2433"/><circle cx="-42" cy="-6" r="5.2" fill="#fff"/><circle cx="-33.5" cy="6" r="2.2" fill="#fff"/></g><g class="blink"><ellipse cx="38" cy="0" rx="12" ry="16" fill="#2a2433"/><circle cx="34" cy="-6" r="5.2" fill="#fff"/><circle cx="42.5" cy="6" r="2.2" fill="#fff"/></g><g transform="translate(0 30)"><path d="M-20 -3 Q0 28 20 -3Z" fill="#4a1d2f" stroke="#2a2433" stroke-width="4" stroke-linejoin="round"/><path d="M-10 10 Q0 2 10 10 Q0 17 -10 10Z" fill="#ff7d96"/></g></g></g></g><text x="256" y="476" text-anchor="middle" font-family="Avenir Next Rounded, Arial Rounded MT Bold, Nunito, Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="56" letter-spacing="0.5" fill="#f08c00" stroke="#fff" stroke-width="16" stroke-linejoin="round" paint-order="stroke">On my way</text></g>
</svg>