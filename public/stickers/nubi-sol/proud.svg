<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="cut" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d"/>
<feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="edge"/>
<feGaussianBlur in="d" stdDeviation="7" result="b"/><feOffset in="b" dy="9" result="o"/>
<feFlood flood-color="#1c1835" flood-opacity=".24"/><feComposite in2="o" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="solG" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>
<linearGradient id="solRay" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb52e"/><stop offset="1" stop-color="#ffd86b"/></linearGradient>
</defs>
<style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:256px 400px}
.bob-fast{animation:bob 1.4s ease-in-out infinite}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:wave 1.1s ease-in-out infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle-slow{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin-slow{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.tear{animation:tear 1.2s ease-in infinite}
.zz{animation:zz 2.4s ease-in-out infinite}
.steam{animation:steam 2s ease-in-out infinite}
.flicker{animation:flicker .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.flip{animation:flip 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
.pop{animation:popin 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.push{animation:push 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.shake{animation:shake .32s linear infinite}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.speed{animation:speed .6s linear infinite}
.drip{animation:drip 1.6s ease-in infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.86) rotate(0);opacity:.85}50%{transform:scale(1.1) rotate(12deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tear{0%{stroke-dasharray:0 200;opacity:0}20%{opacity:.95}100%{stroke-dasharray:90 200;opacity:.2}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-12px);opacity:1}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes flicker{to{transform:scaleY(1.08) skewX(-3deg)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
@keyframes popin{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes push{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes speed{0%{transform:translateX(18px);opacity:0}30%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g filter="url(#cut)"><g class="bob"><g class="twinkle"><rect x="126" y="180" width="14" height="14" rx="7" fill="#ff5c8a" stroke="#fff" stroke-width="3" transform="rotate(20 126 180)"/></g><g class="twinkle"><rect x="376" y="160" width="22" height="10" rx="5" fill="#4fc3f7" stroke="#fff" stroke-width="3" transform="rotate(-30 376 160)"/></g><g class="twinkle"><rect x="106" y="310" width="14" height="14" rx="7" fill="#ffd23f" stroke="#fff" stroke-width="3" transform="rotate(60 106 310)"/></g><g class="twinkle"><rect x="406" y="280" width="22" height="10" rx="5" fill="#7ed37f" stroke="#fff" stroke-width="3" transform="rotate(-50 406 280)"/></g><g class="twinkle"><rect x="156" y="120" width="14" height="14" rx="7" fill="#a78bfa" stroke="#fff" stroke-width="3" transform="rotate(10 156 120)"/></g><g class="twinkle"><rect x="346" y="110" width="22" height="10" rx="5" fill="#ff9a3c" stroke="#fff" stroke-width="3" transform="rotate(70 346 110)"/></g><g transform="translate(256 236) scale(1.092)"><g transform="translate(-96 30) rotate(235)"><g transform="scale(1 -1)"><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g transform="translate(96 30) rotate(-55)"><g transform=""><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g class="spin-slow"><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(0)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(30)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(60)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(90)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(120)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(150)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(180)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(210)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(240)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(270)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(300)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(330)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/></g><circle r="100" fill="url(#solG)"/><circle r="97" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-dasharray="120 500" stroke-dashoffset="-330"/>
<ellipse cx="-44" cy="-56" rx="30" ry="15" fill="#fff" opacity=".75" transform="rotate(-35 -44 -56)"/><circle cx="-12" cy="-80" r="6" fill="#fff" opacity=".7"/><g transform="translate(0 0)"><g transform="translate(-38 0)"><g class="twinkle"><path d="M0 -19 L5 -6.88 L18.07 -5.87 L8.08 2.63 L11.17 15.37 L0 8.5 L-11.17 15.37 L-8.08 2.63 L-18.07 -5.87 L-5 -6.88Z" fill="#ffc83d" stroke="#e29a10" stroke-width="2" stroke-linejoin="round"/><circle cx="-5" cy="-6" r="3.2" fill="#fff" opacity=".9"/></g></g><g transform="translate(38 0)"><g class="twinkle"><path d="M0 -19 L5 -6.88 L18.07 -5.87 L8.08 2.63 L11.17 15.37 L0 8.5 L-11.17 15.37 L-8.08 2.63 L-18.07 -5.87 L-5 -6.88Z" fill="#ffc83d" stroke="#e29a10" stroke-width="2" stroke-linejoin="round"/><circle cx="-5" cy="-6" r="3.2" fill="#fff" opacity=".9"/></g></g><g transform="translate(0 30)"><path d="M-27 -6 Q0 40 27 -6Z" fill="#4a1d2f" stroke="#2a2433" stroke-width="4" stroke-linejoin="round"/><path d="M-14 14 Q0 3 14 14 Q0 25 -14 14Z" fill="#ff7d96"/><path d="M-20 -4 H20" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g></g><g transform="translate(300 92) rotate(18)"><path d="M0 -70 L34 10 H-34Z" fill="#7c5cff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M-14 -24 L14 -10 M-22 -2 L22 10 M-6 -48 L10 -40" stroke="#ffd23f" stroke-width="7" stroke-linecap="round"/><circle cy="-74" r="10" fill="#ff5c8a" stroke="#fff" stroke-width="4"/></g></g><text x="256" y="476" text-anchor="middle" font-family="Avenir Next Rounded, Arial Rounded MT Bold, Nunito, Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="56" letter-spacing="0.5" fill="#f08c00" stroke="#fff" stroke-width="16" stroke-linejoin="round" paint-order="stroke">So proud</text></g>
</svg>