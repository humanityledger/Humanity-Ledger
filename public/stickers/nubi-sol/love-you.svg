<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="cut" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d"/>
<feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="edge"/>
<feGaussianBlur in="d" stdDeviation="7" result="b"/><feOffset in="b" dy="9" result="o"/>
<feFlood flood-color="#1c1835" flood-opacity=".24"/><feComposite in2="o" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="nubiG" cx="36%" cy="22%" r="85%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e8ecff"/><stop offset="1" stop-color="#b9c4f2"/></radialGradient>
<linearGradient id="nubiRim" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient><radialGradient id="solG" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient>
<linearGradient id="solRay" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb52e"/><stop offset="1" stop-color="#ffd86b"/></linearGradient>
</defs>
<style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:256px 400px}
.bob-fast{animation:bob 1.4s ease-in-out infinite}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:wave 1.1s ease-in-out infinite}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle-slow{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin-slow{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.tear{animation:tear 1.2s ease-in infinite}
.zz{animation:zz 2.4s ease-in-out infinite}
.steam{animation:steam 2s ease-in-out infinite}
.flicker{animation:flicker .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.flip{animation:flip 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
.pop{animation:popin 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.push{animation:push 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.shake{animation:shake .32s linear infinite}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.speed{animation:speed .6s linear infinite}
.drip{animation:drip 1.6s ease-in infinite}
.dot{animation:dot 1.2s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes twinkle{0%,100%{transform:scale(.86) rotate(0);opacity:.85}50%{transform:scale(1.1) rotate(12deg);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tear{0%{stroke-dasharray:0 200;opacity:0}20%{opacity:.95}100%{stroke-dasharray:90 200;opacity:.2}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-12px);opacity:1}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
@keyframes flicker{to{transform:scaleY(1.08) skewX(-3deg)}}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
@keyframes popin{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes push{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes speed{0%{transform:translateX(18px);opacity:0}30%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g filter="url(#cut)"><g class="bob"><g transform="translate(340 262) scale(0.78)"><g transform="translate(-96 30) rotate(155)"><g transform="scale(1 -1)"><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g transform="translate(96 30) rotate(25)"><g transform=""><rect x="-14" y="-14" width="54" height="28" rx="14" fill="url(#solG)"/><ellipse cx="18" cy="-6.16" rx="12" ry="3.9200000000000004" fill="#fff" opacity=".35"/></g></g><g class="spin-slow"><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(0)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(30)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(60)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(90)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(120)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(150)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(180)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(210)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(240)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(270)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(300)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/><path d="M-15 -98 Q0 -146 15 -98Z" fill="url(#solRay)" transform="rotate(330)" stroke="#ff9d1a" stroke-width="2" stroke-linejoin="round"/></g><circle r="100" fill="url(#solG)"/><circle r="97" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-dasharray="120 500" stroke-dashoffset="-330"/>
<ellipse cx="-44" cy="-56" rx="30" ry="15" fill="#fff" opacity=".75" transform="rotate(-35 -44 -56)"/><circle cx="-12" cy="-80" r="6" fill="#fff" opacity=".7"/><g transform="translate(0 0)"><ellipse cx="-60" cy="22" rx="16" ry="10" fill="#ff8fab" opacity=".75" filter="url(#soft)"/><ellipse cx="60" cy="22" rx="16" ry="10" fill="#ff8fab" opacity=".75" filter="url(#soft)"/><path d="M-52 4 Q-38 -14 -24 4" fill="none" stroke="#2a2433" stroke-width="7" stroke-linecap="round"/><path d="M24 4 Q38 -14 52 4" fill="none" stroke="#2a2433" stroke-width="7" stroke-linecap="round"/><g transform="translate(0 30)"><path d="M-15 0 Q0 15 15 0" fill="none" stroke="#2a2433" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g transform="translate(182 272) scale(0.806)"><g transform="translate(-120 40) rotate(160)"><g transform="scale(1 -1)"><rect x="-15" y="-15" width="59" height="30" rx="15" fill="url(#nubiG)"/><ellipse cx="19.8" cy="-6.6" rx="13.2" ry="4.2" fill="#fff" opacity=".35"/></g></g><g class="wave" style="transform-origin:120px 40px"><g transform="translate(120 40) rotate(-55)"><g transform=""><rect x="-15" y="-15" width="59" height="30" rx="15" fill="url(#nubiG)"/><ellipse cx="19.8" cy="-6.6" rx="13.2" ry="4.2" fill="#fff" opacity=".35"/></g></g></g><path d="M-118 74 C-176 74 -184 -2 -128 -14 C-134 -82 -60 -108 -24 -66 C-4 -124 84 -118 88 -56 C134 -84 186 -32 152 14 C194 30 178 88 124 82 C62 104 -58 104 -118 74Z" fill="url(#nubiG)"/><path d="M-118 74 C-176 74 -184 -2 -128 -14 C-134 -82 -60 -108 -24 -66 C-4 -124 84 -118 88 -56 C134 -84 186 -32 152 14 C194 30 178 88 124 82 C62 104 -58 104 -118 74Z" fill="none" stroke="url(#nubiRim)" stroke-width="6" transform="translate(0 -3) scale(.97)"/>
<ellipse cx="-70" cy="-58" rx="34" ry="16" fill="#fff" opacity=".9" transform="rotate(-24 -70 -58)"/><ellipse cx="-30" cy="-84" rx="10" ry="6" fill="#fff" opacity=".8"/><g transform="translate(0 4)"><ellipse cx="-64" cy="22" rx="16" ry="10" fill="#ff8fab" opacity=".75" filter="url(#soft)"/><ellipse cx="64" cy="22" rx="16" ry="10" fill="#ff8fab" opacity=".75" filter="url(#soft)"/><g transform="translate(-42 0) rotate(8) scale(0.95)"><g class="pulse"><path d="M0 9 C-4 2 -22 -4 -22 -16 C-22 -28 -6 -32 0 -20 C6 -32 22 -28 22 -16 C22 -4 4 2 0 9Z" transform="translate(0 6)" fill="#ff3f6c"/><ellipse cx="-9" cy="-14" rx="5" ry="3.4" fill="#fff" opacity=".85" transform="rotate(-30 -9 -14)"/></g></g><g transform="translate(42 0) rotate(-8) scale(0.95)"><g class="pulse"><path d="M0 9 C-4 2 -22 -4 -22 -16 C-22 -28 -6 -32 0 -20 C6 -32 22 -28 22 -16 C22 -4 4 2 0 9Z" transform="translate(0 6)" fill="#ff3f6c"/><ellipse cx="-9" cy="-14" rx="5" ry="3.4" fill="#fff" opacity=".85" transform="rotate(-30 -9 -14)"/></g></g><g transform="translate(0 30)"><path d="M-20 -3 Q0 28 20 -3Z" fill="#4a1d2f" stroke="#2a2433" stroke-width="4" stroke-linejoin="round"/><path d="M-10 10 Q0 2 10 10 Q0 17 -10 10Z" fill="#ff7d96"/></g></g></g><g transform="translate(262 108) rotate(-6) scale(1.25)"><g class="pulse"><path d="M0 14.4 C-6.4 3.2 -35.2 -6.4 -35.2 -25.6 C-35.2 -44.8 -9.6 -51.2 0 -32 C9.6 -51.2 35.2 -44.8 35.2 -25.6 C35.2 -6.4 6.4 3.2 0 14.4Z" fill="#ff4f7b" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><ellipse cx="-16" cy="-30" rx="8" ry="5" fill="#fff" opacity=".75" transform="rotate(-30 -16 -30)"/></g></g><g transform="translate(120 126) rotate(-20) scale(0.55)"><g class="pulse"><path d="M0 14.4 C-6.4 3.2 -35.2 -6.4 -35.2 -25.6 C-35.2 -44.8 -9.6 -51.2 0 -32 C9.6 -51.2 35.2 -44.8 35.2 -25.6 C35.2 -6.4 6.4 3.2 0 14.4Z" fill="#ff8fab" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><ellipse cx="-16" cy="-30" rx="8" ry="5" fill="#fff" opacity=".75" transform="rotate(-30 -16 -30)"/></g></g><g transform="translate(410 120) rotate(18) scale(0.5)"><g class="pulse"><path d="M0 14.4 C-6.4 3.2 -35.2 -6.4 -35.2 -25.6 C-35.2 -44.8 -9.6 -51.2 0 -32 C9.6 -51.2 35.2 -44.8 35.2 -25.6 C35.2 -6.4 6.4 3.2 0 14.4Z" fill="#ff8fab" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><ellipse cx="-16" cy="-30" rx="8" ry="5" fill="#fff" opacity=".75" transform="rotate(-30 -16 -30)"/></g></g></g><text x="256" y="476" text-anchor="middle" font-family="Avenir Next Rounded, Arial Rounded MT Bold, Nunito, Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="56" letter-spacing="0.5" fill="#f03e6e" stroke="#fff" stroke-width="16" stroke-linejoin="round" paint-order="stroke">Love you</text></g>
</svg>