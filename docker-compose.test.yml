version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: humanity_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d humanity_test']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # ephemeral — no data persists between test runs

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=postgresql://test:test@localhost:5433/humanity_test \
#   REDIS_URL=redis://localhost:6380 \
#   npx prisma migrate deploy
#   npx vitest run
#   docker compose -f docker-compose.test.yml down
