# coturn for Ledger Relay. Credentials come from the relay (TURN REST API): the shared secret is
# passed on the command line (docker-compose.yml) and is the relay's RELAY_TURN_SECRET.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
# Media relayed here is DTLS-SRTP: coturn passes encrypted packets and cannot decrypt them.
no-cli
no-multicast-peers
# Never relay to private or loopback ranges: the relay must not reach into the host's network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
min-port=49152
max-port=65535
total-quota=1000
user-quota=12
stale-nonce=600
# Logs without addresses of relayed peers.
simple-log
no-stdout-log
log-file=/dev/null
# For TLS on 5349, mount a certificate and uncomment:
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
