services:
  # Aztec v6 Testnet Node (Sequencer Mode)
  aztec-sequencer:
    image: azteclabs/aztec:6.0.0-rc.1
    command: ["start", "--node", "--sequencer", "--archiver"]
    ports:
      - "18081:8081"
      - "40400:40400"
    environment:
      # L1 parameters for v6 Testnet (Sep 28)
      ETHEREUM_HOST: https://sepolia.infura.io/v3/${INFURA_API_KEY:-dummy}
      L1_CHAIN_ID: 11155111
      AZTEC_PORT: 8081
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Sequencer Identity
      SEQ_PUBLISHER_PRIVATE_KEY: ${SEQ_PUBLISHER_PRIVATE_KEY:-dummy}
      SEQ_SENDER_PRIVATE_KEY: ${SEQ_SENDER_PRIVATE_KEY:-dummy}
      P2P_ENABLED: "true"
      P2P_PORT: 40400
      BOOTSTRAP_NODES: ${BOOTSTRAP_NODES:-dummy}
    restart: unless-stopped

  # Aztec PXE (Private Execution Environment) connecting to local sequencer
  aztec-pxe:
    image: azteclabs/aztec:6.0.0-rc.1
    command: ["start", "--pxe", "--node-url", "http://aztec-sequencer:8081"]
    ports:
      - "18080:8080"
    depends_on:
      - aztec-sequencer
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: info
    restart: unless-stopped
