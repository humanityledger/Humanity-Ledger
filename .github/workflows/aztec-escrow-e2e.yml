# End-to-end run of a keyed PrivateEscrow on Aztec testnet: throwaway
# accounts paid by the sponsored FPC, a fresh test token, deposit with authwit,
# claim with the claim secret. No secrets; every transaction hash goes to the
# job summary and to the e2e-escrow-receipt artifact.

name: Aztec escrow e2e (testnet)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/aztec/e2e-escrow-testnet.mts'
      - '.github/workflows/aztec-escrow-e2e.yml'

permissions:
  contents: read

concurrency:
  group: aztec-escrow-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: SDK surface used by the script
        run: |
          node --conditions=browser --input-type=module -e "
          const c = await import('@aztec-labs/aztec.js/contracts');
          console.log('contracts exports:', Object.keys(c).sort().join(', '));
          console.log('Contract statics:', Object.getOwnPropertyNames(c.Contract).join(', '));
          const t = await import('@aztec-labs/noir-contracts.js/Token');
          console.log('TokenContract.deploy:', t.TokenContract.deploy.toString().slice(0, 600));
          console.log('TokenContract statics:', Object.getOwnPropertyNames(t.TokenContract).join(', '));
          console.log('DeployMethod.create:', c.DeployMethod.create.toString().slice(0, 2500)); const src = c.DeployMethod.toString(); const i = src.indexOf('constructor(wallet'); console.log('DeployMethod constructor:', src.slice(i, i + 2500)); for (const k of ['send','getInstance','request']) { const j = src.indexOf(k + '('); console.log('DeployMethod.' + k + ':', src.slice(j, j + 1200)); } console.log('UniversalDeployMethod:', c.UniversalDeployMethod.toString().slice(0, 1500));
          " || true
      - name: Keyed escrow, deposit and claim on testnet
        run: node --conditions=browser --import tsx --import ./scripts/aztec/register.mjs scripts/aztec/e2e-escrow-testnet.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-escrow-receipt
          path: e2e-escrow-receipt.json
          if-no-files-found: ignore
