# Internal security review (Phase 0): static analysis, invariant fuzzing, symbolic checks,
# mutation testing, coverage, Noir negative tests and differential vectors.
# docs/audit/INTERNAL_SECURITY_REVIEW_2026-11-18.md records the run ids of this workflow.
#
# Every tool is installed here, in CI. Nothing in this workflow holds a key, signs, broadcasts or
# commits: it only reads the repository and reports.

name: Security review

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # nightly: 1,000,000 runs per invariant, Noir mutation
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run the nightly depth now'
        type: boolean
        default: false

permissions:
  contents: read

# No cancel-in-progress: the Gambit job runs for hours and its result must survive new pushes.
concurrency:
  group: security-review-${{ github.ref }}-${{ github.sha }}

env:
  FORGE_STD_REF: v1.9.4
  SOLC_VERSION: 0.8.24

jobs:
  static:
    name: Slither + Aderyn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std
        run: git clone --depth 1 --branch "$FORGE_STD_REF" https://github.com/foundry-rs/forge-std foundry-lib/forge-std
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Slither
        run: |
          pip install slither-analyzer==0.10.4 solc-select
          solc-select install "$SOLC_VERSION" && solc-select use "$SOLC_VERSION"
      - name: Slither (fails on medium or higher; exclusions justified in slither.config.json)
        run: |
          set -o pipefail
          slither . --config-file slither.config.json --compile-force-framework foundry --json slither.json --checklist > slither.md || rc=$?
          python3 -c "import json;d=json.load(open('slither.json'));[print(r['id'][:12], r['impact'], r['check'], r['description'].splitlines()[0][:160]) for r in d['results'].get('detectors', [])]" | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}
      - name: Install Aderyn
        if: always()
        # Cyfrin retired Aderyn in 2026 and withdrew its installer (run 44275097419 printed
        # "Aderyn has been retired and is no longer maintained"). The last crates.io release is
        # still tried; when it cannot be installed the step says so and Aderyn is skipped.
        id: aderyn_install
        run: |
          if cargo install aderyn --locked; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::warning::Aderyn could not be installed (retired upstream); skipped."; echo "### Aderyn: not available (retired upstream)" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Aderyn
        if: always() && steps.aderyn_install.outputs.ok == '1'
        run: |
          aderyn . -o aderyn-report.md
          echo "### Aderyn" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^## (H|L)-[0-9]+' aderyn-report.md >> "$GITHUB_STEP_SUMMARY" || echo "no issues" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '^## H-[0-9]+' aderyn-report.md; then echo "::error::Aderyn reports high issues"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: |
            slither.json
            slither.md
            aderyn-report.md

  foundry:
    name: Foundry (unit, fuzz, invariants 10k, differential, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std
        run: git clone --depth 1 --branch "$FORGE_STD_REF" https://github.com/foundry-rs/forge-std foundry-lib/forge-std
      - name: Differential vectors are current
        run: node scripts/security/portal-vectors.mjs --check
      - name: forge build
        run: forge build --sizes
      - name: forge test (profile ci; nightly depth on schedule)
        env:
          FOUNDRY_PROFILE: ${{ (github.event_name == 'schedule' || inputs.deep) && 'nightly' || 'ci' }}
        run: forge test -vv --gas-report
      - name: Coverage (100% lines and branches for the portal and the receivers)
        run: |
          forge coverage --report lcov --report summary --no-match-coverage '(test/|mocks/|foundry-lib/)'
          node scripts/security/check-coverage.mjs lcov.info
      - name: TypeScript side of the differential vectors
        run: npx vitest run test/unit/portal/content-vectors.test.ts test/unit/portal/receivers.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-coverage
          path: lcov.info

  halmos:
    name: Halmos (caps, timelock, sha256ToField, salt)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std
        run: git clone --depth 1 --branch "$FORGE_STD_REF" https://github.com/foundry-rs/forge-std foundry-lib/forge-std
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install halmos
      - name: halmos
        run: halmos --forge-build-out out-foundry --contract PortalHalmos --function check_ --solver-timeout-assertion 600000

  gambit:
    name: Gambit mutation testing (>= 90% killed)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std
        run: git clone --depth 1 --branch "$FORGE_STD_REF" https://github.com/foundry-rs/forge-std foundry-lib/forge-std
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: solc
        run: |
          pip install solc-select
          solc-select install "$SOLC_VERSION" && solc-select use "$SOLC_VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Gambit
        run: cargo install --locked --git https://github.com/Certora/gambit.git
      - name: Mutate
        run: gambit mutate --json gambit.json
      - name: Kill
        run: node scripts/security/gambit-run.mjs --min-score 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gambit
          path: gambit_out/**/gambit_results.json

  noir:
    name: aztec test, a negative test per assert, Noir mutation (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Every assert has a negative test
        run: node scripts/security/noir-negative-tests.mjs
      - name: Differential vectors are current (Noir block included)
        run: node scripts/security/portal-vectors.mjs --check
      - name: Install the Aztec 6.0.0 toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://install.aztec.network -o /tmp/install-aztec.sh
          VERSION=6.0.0 NON_INTERACTIVE=1 bash /tmp/install-aztec.sh </dev/null
          for d in "$HOME/.aztec/bin" "$HOME/.aztec/current/bin" "$HOME/.aztec/versions/6.0.0/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
      - name: Compile every crate (tests deploy ../test_token)
        run: |
          set -euo pipefail
          for dir in contracts/aztec/*/; do
            [ -f "$dir/Nargo.toml" ] || continue
            (cd "$dir" && aztec compile)
          done
      - name: aztec test, inside each crate
        run: |
          set -uo pipefail
          failed=""
          for dir in contracts/aztec/*/; do
            [ -f "$dir/src/test.nr" ] || continue
            echo "::group::aztec test $dir"
            (cd "$dir" && aztec test) || failed="$failed $dir"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::TXE tests failed in:$failed"; exit 1; fi
      - name: Noir mutation (nightly or on demand)
        if: github.event_name == 'schedule' || inputs.deep
        run: |
          set -uo pipefail
          for c in escrow streams portal_token identity; do
            node scripts/security/noir-mutate.mjs --crate "contracts/aztec/$c" --max 25 --seed 18112026 | tee "noir-mutation-$c.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noir-mutation
          path: noir-mutation-*.log
          if-no-files-found: ignore
