# Noir circuits CI.
#
# Replaces the old "Private Aztec CI", which installed Noir 0.36 and Aztec CLI
# 0.67 (both incompatible with the code) and ran every step with `|| true`, so
# it could not fail. Master prompt: docs/zk/MASTER_PROMPT.md (bucle de
# verificación, paso 1).

name: Noir circuits

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  noir:
    name: nargo 1.0.0 — check, test, compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nargo 1.0.0
        run: |
          curl -fsSL https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          "$HOME/.nargo/bin/noirup" --version 1.0.0
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"

      - name: nargo version
        run: nargo --version

      - name: Check and test every crate in circuits/
        run: |
          set -euo pipefail
          for dir in circuits/*/; do
            [ -f "$dir/Nargo.toml" ] || continue
            echo "::group::$dir"
            (cd "$dir" && nargo check && nargo test)
            echo "::endgroup::"
          done

      - name: Committed ACIR of the pinned circuits equals a fresh compile
        run: |
          set -euo pipefail
          for c in escrow identity streams; do
            tmp="$(mktemp -d)"
            cp -r "circuits/$c" "$tmp/"
            rm -rf "$tmp/$c/target"
            (cd "$tmp/$c" && nargo compile)
            fresh="$(jq -r .bytecode "$tmp/$c/target/zk_$c.json")"
            committed="$(jq -r .bytecode "circuits/$c/target/zk_$c.json")"
            if [ "$fresh" != "$committed" ]; then
              echo "::error::circuits/$c: committed ACIR differs from a fresh compile"
              exit 1
            fi
            echo "ok  $c: committed ACIR matches"
          done

      - name: Compile the experimental v2 circuits
        run: |
          set -euo pipefail
          for c in escrow_v2 identity_v2 streams_v2; do
            (cd "circuits/$c" && nargo compile && nargo info)
          done

      - name: Pinned VK hashes (no npm needed)
        run: node scripts/zk/check-artifacts.mjs --fast

      - name: Keep compiled v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2-acir
          path: circuits/*_v2/target/*.json
          retention-days: 14

  vk:
    name: Barretenberg — re-derive pinned VKs, derive v2 VKs
    needs: noir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: v2-acir
          path: circuits

      - name: Pinned VKs re-derived from the committed ACIR
        run: node scripts/zk/check-artifacts.mjs

      - name: VKs of the v2 circuits (compared with the pins)
        run: node scripts/zk/v2-vks.mjs

      - name: ZK and contract tests (vitest, real proving)
        run: >
          npx vitest run
          test/zk
          test/circuits
          test/unit/aztec/circuit-proving.test.ts
          test/unit/aztec/grumpkin.test.ts
          test/unit/aztec/native-contracts.test.ts
          test/unit/aztec/keyed-deploy.test.ts
          test/aztec_vk_integrity.test.ts
          test/vk_hash_mismatch.test.ts

      - name: Keep v2 VKs
        uses: actions/upload-artifact@v4
        with:
          name: v2-vks
          path: circuits/*_v2/target/vk*
          retention-days: 14
