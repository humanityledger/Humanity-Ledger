# Aztec contracts CI (contracts/aztec/*).
#
# Compiles every aztec-nr contract with the Aztec 6.0.0 toolchain and reports
# whether the committed artifacts match a fresh compile, then runs the TXE
# tests of every contract that has src/test.nr. On claude/** branches
# it commits refreshed artifacts back to the branch, so an agent without the
# toolchain can change contract sources and still keep source and artifacts in
# sync. On main and pull requests it only checks.

name: Aztec contracts

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'contracts/aztec/**'
      - '.github/workflows/aztec-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/aztec/**'

permissions:
  contents: write

jobs:
  compile:
    name: aztec compile (6.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the Aztec 6.0.0 toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://install.aztec.network -o /tmp/install-aztec.sh
          VERSION=6.0.0 NON_INTERACTIVE=1 bash /tmp/install-aztec.sh </dev/null
          for d in "$HOME/.aztec/bin" "$HOME/.aztec/current/bin" "$HOME/.aztec/versions/6.0.0/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          ls -la "$HOME/.aztec" || true

      - name: Toolchain versions
        run: |
          aztec --version || true
          which aztec

      - name: Compile every contract
        id: compile
        run: |
          set -euo pipefail
          for dir in contracts/aztec/*/; do
            [ -f "$dir/Nargo.toml" ] || continue
            echo "::group::$dir"
            (cd "$dir" && rm -rf target && aztec compile && ls -la target)
            echo "::endgroup::"
          done

      - name: Committed artifacts vs fresh compile
        run: |
          git status --short contracts/aztec
          git diff --stat -- contracts/aztec || true

      # Runs even if the TXE tests fail: the artifacts only depend on the
      # sources compiling. Rebases first, as the branch may have moved since
      # checkout.
      - name: Commit refreshed artifacts (claude/** branches only)
        if: always() && steps.compile.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/aztec/*/target/*.json
          if git diff --cached --quiet; then
            echo "Artifacts already match the sources."
          else
            git commit -m "chore(aztec): recompile contracts/aztec artifacts with Aztec 6.0.0 (CI)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail on main or PRs if artifacts are stale
        if: always() && steps.compile.outcome == 'success' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/claude/'))
        run: git diff --exit-code -- contracts/aztec

      # TXE tests (src/test.nr of each contract). They deploy compiled
      # artifacts, including ../test_token, so they run after every crate has
      # been compiled.
      - name: TXE tests (aztec test)
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -uo pipefail
          failed=""
          for dir in contracts/aztec/*/; do
            [ -f "$dir/src/test.nr" ] || continue
            echo "::group::aztec test $dir"
            (cd "$dir" && aztec test) || failed="$failed $dir"
            echo "::endgroup::"
          done
          # Every crate is tested even when an earlier one fails.
          if [ -n "$failed" ]; then echo "::error::TXE tests failed in:$failed"; exit 1; fi
