name: Lighthouse CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_ZK_MODE: testnet
          JWT_SECRET: test_secret_key_minimum_32_characters_long_for_ci
          ENCLAVE_PIN_PEPPER: test_pepper_secret_minimum_32_chars
          ENCLAVE_PIN_SECRET: test_pin_secret_minimum_32_chars

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
