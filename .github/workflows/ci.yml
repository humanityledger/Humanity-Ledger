name: CI — Typecheck, Lint & Secret Scan

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript + ESLint + Forbidden Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SKIP_ENV_VALIDATION: 'true'
      - name: Type check
        run: npx tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: 'true'
      - name: Lint
        run: npx next lint
      - name: Forbidden patterns check
        run: node scripts/forbidden-patterns.mjs
      - name: Unit Tests (security)
        run: npx vitest run test/unit/security
        env:
          JWT_SECRET: test-jwt-secret-minimum-32-chars-ok
          ENCLAVE_PIN_PEPPER: test-pepper-minimum-32-chars-ok-12
          ENCLAVE_PIN_SECRET: test-secret-minimum-32-chars-ok-12

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
