name: CI — Typecheck, Lint & Secret Scan

on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript + ESLint + Forbidden Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SKIP_ENV_VALIDATION: 'true'
      - name: Type check
        run: npx tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: 'true'
      - name: Lint
        run: npx next lint
      - name: Forbidden patterns check
        run: node scripts/forbidden-patterns.mjs
      - name: One Aztec SDK (@aztec-labs, pinned), aliases resolve
        run: node scripts/aztec/check-sdk-single-version.mjs
      - name: Contract artifacts were compiled from the sources in this tree
        run: node scripts/aztec/check-artifact-sources.mjs
      - name: SDK still encrypts the wallet stores (kv-store, wallets, pxe)
        run: node scripts/aztec/inspect-store-encryption.mjs
      - name: Unit Tests (Aztec client gates, payments, chat handoff)
        run: >
          npx vitest run
          test/unit/aztec/agreement-invite.test.ts
          test/unit/aztec/agreement-confirm.test.ts
          test/unit/aztec/agreement-message.test.ts
          test/unit/aztec/agreement-policy.test.ts
          test/unit/aztec/agreement-order.test.ts
          test/unit/aztec/token-check.test.ts
          test/unit/aztec/direct-payment.test.ts
          test/unit/aztec/peer-binding.test.ts
          test/unit/aztec/fee-juice.test.ts
          test/unit/aztec/fees.test.ts
          test/unit/aztec/single-flight.test.ts
          test/unit/aztec/stream-terms.test.ts
          test/unit/aztec/wallet-wipe.test.ts
          test/unit/aztec/deployments-registry.test.ts
          test/unit/aztec/value-mode.test.ts
          test/unit/security/audit-2026-11-11.test.ts
          test/unit/auth/pin-lock.test.ts
          test/unit/aztec/store-encryption.test.ts
          test/unit/aztec/address-fingerprint.test.ts
          test/unit/payments
          test/unit/auth/wallet-links.test.ts
          test/unit/chat/value-handoff.test.ts
          test/unit/studio
          test/unit/studio-store-sanitize.test.ts
      - name: Unit Tests (security)
        run: npx vitest run test/unit/security
        env:
          JWT_SECRET: test-jwt-secret-minimum-32-chars-ok
          ENCLAVE_PIN_PEPPER: test-pepper-minimum-32-chars-ok-12
          ENCLAVE_PIN_SECRET: test-secret-minimum-32-chars-ok-12

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true
