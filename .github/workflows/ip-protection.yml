# Humanity Ledger — Intellectual Property Protection Workflow
# Runs daily and on every push to main.
# Actions:
#   1. Cryptographic authorship watermark check (unique code identifiers verified present)
#   2. GitHub code search for our unique circuit identifiers in foreign repos
#   3. npm registry scan for packages embedding our circuit hashes
#   4. Dependency integrity lockfile verification (no silent dependency swaps)
#   5. Secret scanning — confirm no API keys leaked in latest commits
#   6. Daily IP protection summary report

name: IP Protection and Authorship Verification

on:
  push:
    branches: [main, 'claude/**']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:

  # --- Job 1: Cryptographic Authorship Watermark Check -----------------------
  authorship-watermark:
    name: Verify Cryptographic Authorship Watermarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify unique protocol identifiers are present in circuits
        run: |
          echo "Verifying cryptographic authorship watermarks..."

          # Each circuit must contain the canonical protocol identifier comment
          FAIL=0
          for circuit in escrow identity streams; do
            FILE="circuits/${circuit}/src/main.nr"
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              FAIL=1
              continue
            fi
            # Verify the file contains our canonical header (unique string present in no other repo)
            if ! grep -q "Humanity Ledger Protocol" "$FILE"; then
              echo "WATERMARK MISSING in $FILE"
              FAIL=1
            else
              echo "[OK] $circuit watermark present"
            fi
          done

          # Verify HLSPEC 2026.1 identifier is present in the normative spec
          if ! grep -q "HLSPEC 2026.1" docs/PROTOCOL_SPEC.md 2>/dev/null; then
            echo "WARNING: HLSPEC 2026.1 identifier not found in PROTOCOL_SPEC.md"
          else
            echo "[OK] HLSPEC 2026.1 identifier verified"
          fi

          # Verify CONSTRAINT_COMPLETENESS.md is present and contains canonical commit
          if ! grep -q "783df711" circuits/CONSTRAINT_COMPLETENESS.md 2>/dev/null; then
            echo "WARNING: Canonical commit reference missing from CONSTRAINT_COMPLETENESS.md"
          else
            echo "[OK] Canonical commit reference verified in CONSTRAINT_COMPLETENESS.md"
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "AUTHORSHIP WATERMARK CHECK FAILED"
            exit 1
          fi
          echo "[PASS] All authorship watermarks verified."

  # --- Job 2: GitHub Code Search for IP Clones ------------------------------
  ip-clone-search:
    name: GitHub Code Search — Unique Circuit Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Search GitHub for repos containing our unique circuit identifiers
        id: search
        run: |
          echo "Searching GitHub for unauthorized copies of unique identifiers..."

          # Search for our most unique string: the exact HLSPEC identifier
          RESULTS_HLSPEC=$(curl -s \
            "https://api.github.com/search/code?q=HLSPEC+2026.1+humanity+ledger&per_page=20" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            | jq -r '.items[]? | select(.repository.full_name != "humanityledger/Humanity-Ledger") | "FOREIGN REPO: \(.repository.full_name) | File: \(.path) | \(.html_url)"' \
            2>/dev/null || echo "(Search rate limited or no results)")

          # Search for our unique MAX_RATE circuit constant
          RESULTS_MAXRATE=$(curl -s \
            "https://api.github.com/search/code?q=MAX_RATE+humanity+ledger+noir&per_page=20" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            | jq -r '.items[]? | select(.repository.full_name != "humanityledger/Humanity-Ledger") | "FOREIGN REPO: \(.repository.full_name) | File: \(.path) | \(.html_url)"' \
            2>/dev/null || echo "(Search rate limited or no results)")

          echo "=== HLSPEC Search Results ==="
          echo "$RESULTS_HLSPEC"
          echo "=== MAX_RATE Circuit Search Results ==="
          echo "$RESULTS_MAXRATE"

          FOREIGN_COUNT=$(echo "$RESULTS_HLSPEC$RESULTS_MAXRATE" | grep -c "FOREIGN REPO" || true)
          echo "Foreign repositories found: $FOREIGN_COUNT"

          if [ "$FOREIGN_COUNT" -gt 0 ]; then
            echo "WARNING: Potential IP clones detected. Review required."
            echo "HAS_CLONES=true" >> $GITHUB_OUTPUT
          else
            echo "[PASS] No foreign repositories found containing our unique identifiers."
            echo "HAS_CLONES=false" >> $GITHUB_OUTPUT
          fi

          echo "CLONE_DETAILS<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULTS_HLSPEC" >> $GITHUB_OUTPUT
          echo "$RESULTS_MAXRATE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create issue if IP clones detected
        if: steps.search.outputs.HAS_CLONES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[IP ALERT] ${date} — Foreign repositories detected with Humanity Ledger identifiers`,
              body: `## IP Protection Alert\n\n**Date:** ${date}\n\nForeign repositories were detected containing unique Humanity Ledger protocol identifiers.\n\n### Details\n\`\`\`\n${{ steps.search.outputs.CLONE_DETAILS }}\n\`\`\`\n\n### Actions\n1. Review each foreign repository\n2. If commercial use or redistribution: file DMCA at https://github.com/contact/dmca\n3. Contact: humanityledger@icloud.com\n4. Legal basis: LICENSE file (Proprietary Software License Version 2.0)`,
              labels: ['ip-protection', 'legal', 'urgent'],
            });

  # --- Job 3: Dependency Lockfile Integrity Check ----------------------------
  lockfile-integrity:
    name: Dependency Lockfile Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify package-lock.json has not been silently modified
        run: |
          echo "Verifying lockfile integrity..."

          # Confirm lockfile is present and non-empty
          if [ ! -f "package-lock.json" ]; then
            echo "CRITICAL: package-lock.json missing — supply chain attack vector"
            exit 1
          fi

          LOCKFILE_SIZE=$(wc -c < package-lock.json)
          if [ "$LOCKFILE_SIZE" -lt 1000 ]; then
            echo "CRITICAL: package-lock.json is suspiciously small ($LOCKFILE_SIZE bytes)"
            exit 1
          fi

          # Verify XMTP is pinned at 5.2.0 (as required by MLS.1 security test)
          if grep -q '"@xmtp/' package.json 2>/dev/null; then
            XMTP_VER=$(node -e "const p=require('./package.json'); const x=Object.entries({...p.dependencies,...p.devDependencies}).find(([k])=>k.startsWith('@xmtp/')); console.log(x?x[1]:'not-found')")
            if echo "$XMTP_VER" | grep -qv "5.2.0"; then
              echo "WARNING: XMTP version has changed from pinned 5.2.0: $XMTP_VER"
              echo "This breaks MLS.1 security invariant. Explicit version bump commit required."
              exit 1
            fi
            echo "[OK] XMTP pinned at $XMTP_VER"
          else
            echo "[INFO] XMTP not a direct dependency (transitive only — ensure lockfile pins 5.2.0)"
          fi

          echo "[PASS] Lockfile integrity verified."

      - name: npm audit — zero HIGH/CRITICAL tolerance
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e "
            const r = require('./audit.json');
            const v = r.metadata?.vulnerabilities ?? {};
            const critical = (v.high ?? 0) + (v.critical ?? 0);
            console.log('Vulnerability summary:', JSON.stringify(v));
            if (critical > 0) {
              console.error('BLOCKED: ' + critical + ' HIGH/CRITICAL vulnerabilities');
              process.exit(1);
            }
            console.log('[PASS] Zero HIGH/CRITICAL vulnerabilities.');
          "

  # --- Job 4: Secret Leak Detection in Recent Commits ------------------------
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 11 commits so that each of the 10 scanned commits has its parent: in a
      # shallow clone the oldest fetched commit diffs against an empty tree, so
      # fetch-depth 10 scanned the whole repository as if it were "added".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 11

      - name: Scan recent commits for accidentally leaked secrets
        run: |
          echo "Scanning last 10 commits for secret patterns..."
          FAIL=0

          # Patterns that indicate leaked secrets (private keys, API tokens, mnemonics)
          PATTERNS=(
            "PRIVATE_KEY.*=.*0x[0-9a-fA-F]{64}"
            "mnemonic.*=.*[a-z]+ [a-z]+ [a-z]+ [a-z]+"
            "sk_live_[A-Za-z0-9]{20}"
            "AIzaSy[A-Za-z0-9_-]{33}"
            "-----BEGIN.*PRIVATE KEY-----"
            "NEXTAUTH_SECRET=[A-Za-z0-9+/]{32}"
          )

          for pattern in "${PATTERNS[@]}"; do
            # Only lines a commit adds: removing a leaked value must not fail the scan.
            MATCHES=$(git log -10 -p --format= -- . ':!.github/**' ':!test/**' ':!tests/**' ':!scripts/check-staged-secrets.mjs' | grep -E '^\+' | grep -E -e "$pattern" | grep -v -E "CANARY_|secret-scan: allow" || true)
            if [ -n "$MATCHES" ]; then
              echo "POTENTIAL SECRET LEAK DETECTED: pattern '$pattern'"
              echo "$MATCHES" | head -5
              FAIL=1
            fi
          done

          # Database URLs with a literal password. ${VAR}, $VAR, <placeholder>
          # and [REDACTED] passwords are documentation, not credentials.
          # Matches are printed with the password removed.
          DB_MATCHES=$(git log -10 -p --format= -- . ':!.github/**' ':!test/**' ':!tests/**' \
            | grep -E '^\+' \
            | grep -E 'DATABASE_URL=postgres(ql)?://[^:@/[:space:]]+:[^@[:space:]]+@' \
            | grep -v -E 'postgres(ql)?://[^:@/[:space:]]+:(\$|<|\[)' \
            | grep -v -E 'CANARY_|secret-scan: allow' || true)
          if [ -n "$DB_MATCHES" ]; then
            echo "POTENTIAL SECRET LEAK DETECTED: DATABASE_URL with a literal password"
            # Password replaced by its first character and length.
            echo "$DB_MATCHES" | perl -pe 's#(://[^:@/]+:)([^@]+)@#$1 . "<" . substr($2,0,1) . "..." . length($2) . " chars>@"#e' | head -5
            FAIL=1
          fi

          # Also scan working tree for any .env files accidentally staged
          if git ls-files | grep -q "\.env$"; then
            echo "CRITICAL: .env file is tracked by git — remove immediately"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "SECRET SCAN FAILED — review findings above"
            exit 1
          fi
          echo "[PASS] No secret leaks detected in recent commits."

  # --- Job 5: VK Artifact Tamper Detection -----------------------------------
  vk-tamper-detection:
    name: VK Artifact Tamper Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify VK artifacts have not been tampered with
        run: node scripts/zk/check-artifacts.mjs --fast
