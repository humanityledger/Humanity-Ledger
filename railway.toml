[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
preDeployCommand = "node scripts/railway-pre-deploy.js"
startCommand = "sh ./start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[healthcheck]
path = "/api/health"
interval = 15
timeout = 60
startPeriod = 120
retries = 5
