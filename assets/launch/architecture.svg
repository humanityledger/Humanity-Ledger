<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Ledger Chat architecture: messages over XMTP, private payments proved on the device and settled on Aztec</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="54" font-size="26" font-weight="700" fill="#111827">Ledger Chat</text>
  <text x="40" y="82" font-size="16" fill="#4b5563">Messages over XMTP. Private payments proved on your device and settled on Aztec.</text>

  <!-- Device -->
  <rect x="40" y="118" width="420" height="440" rx="18" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="64" y="154" font-size="13" font-weight="700" letter-spacing="1.5" fill="#111827">YOUR DEVICE · THE BROWSER</text>

  <rect x="64" y="174" width="372" height="74" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="84" y="204" font-size="17" font-weight="600" fill="#111827">Wallet</text>
  <text x="84" y="228" font-size="14" fill="#4b5563">Signs. Private keys never leave the device.</text>

  <rect x="64" y="262" width="372" height="74" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="84" y="292" font-size="17" font-weight="600" fill="#111827">Encrypted message store</text>
  <text x="84" y="316" font-size="14" fill="#4b5563">Local SQLite, key held by the device.</text>

  <rect x="64" y="350" width="372" height="74" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="84" y="380" font-size="17" font-weight="600" fill="#111827">G7 peer check</text>
  <text x="84" y="404" font-size="14" fill="#4b5563">The payee is the Aztec address bound to this chat.</text>

  <rect x="64" y="438" width="372" height="98" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="84" y="468" font-size="17" font-weight="600" fill="#111827">Aztec PXE (WebAssembly)</text>
  <text x="84" y="492" font-size="14" fill="#4b5563">Builds the zero-knowledge proof locally.</text>
  <text x="84" y="514" font-size="14" fill="#4b5563">Amount and recipient stay private.</text>

  <!-- XMTP -->
  <rect x="600" y="118" width="300" height="118" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="624" y="154" font-size="13" font-weight="700" letter-spacing="1.5" fill="#111827">XMTP NETWORK</text>
  <text x="624" y="184" font-size="15" fill="#374151">Relays MLS ciphertext</text>
  <text x="624" y="206" font-size="15" fill="#374151">(RFC 9420). Sees who talks</text>
  <text x="624" y="228" font-size="15" fill="#374151">to whom, not what.</text>

  <!-- Aztec -->
  <rect x="600" y="402" width="300" height="156" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="438" font-size="13" font-weight="700" letter-spacing="1.5" fill="#111827">AZTEC NETWORK · ALPHA</text>
  <text x="624" y="468" font-size="15" fill="#374151">Verifies the proof, stores</text>
  <text x="624" y="490" font-size="15" fill="#374151">private notes and nullifiers.</text>
  <text x="624" y="520" font-size="15" fill="#374151">Public: a transaction</text>
  <text x="624" y="542" font-size="15" fill="#374151">happened, and its fee.</text>

  <!-- Ethereum -->
  <rect x="980" y="430" width="180" height="100" rx="18" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="1002" y="466" font-size="13" font-weight="700" letter-spacing="1.5" fill="#111827">ETHEREUM</text>
  <text x="1002" y="494" font-size="15" fill="#374151">Settles the</text>
  <text x="1002" y="516" font-size="15" fill="#374151">rollup.</text>

  <!-- Server -->
  <rect x="980" y="118" width="180" height="200" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="1002" y="154" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4b5563">LEDGER CHAT</text>
  <text x="1002" y="172" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4b5563">SERVER</text>
  <text x="1002" y="200" font-size="14" fill="#4b5563">Sign-in (SIWE),</text>
  <text x="1002" y="220" font-size="14" fill="#4b5563">presence, encrypted</text>
  <text x="1002" y="240" font-size="14" fill="#4b5563">attachments.</text>
  <text x="1002" y="270" font-size="14" fill="#4b5563">No keys. No direct</text>
  <text x="1002" y="290" font-size="14" fill="#4b5563">message content.</text>

  <!-- Arrows -->
  <path d="M460 300 C 530 300, 540 177, 596 177" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="472" y="328" font-size="13" fill="#111827">messages</text>
  <text x="472" y="344" font-size="13" fill="#6b7280">ciphertext only</text>

  <path d="M436 487 L 596 487" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="470" y="474" font-size="13" fill="#111827">payment</text>
  <text x="470" y="508" font-size="13" fill="#6b7280">proof + encrypted</text>
  <text x="470" y="524" font-size="13" fill="#6b7280">notes + public fee</text>

  <path d="M900 480 L 976 480" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>

  <path d="M460 140 L 540 140 L 540 104 L 1070 104 L 1070 114" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="760" y="96" font-size="13" fill="#6b7280">sign-in, presence, encrypted files</text>

  <!-- Footer -->
  <line x1="40" y1="590" x2="1160" y2="590" stroke="#e5e7eb"/>
  <text x="40" y="620" font-size="14" fill="#111827"><tspan font-weight="700">Never leaves the device:</tspan> private keys, message plaintext, payment amount and recipient.</text>
  <text x="40" y="646" font-size="14" fill="#4b5563">Closed cUSDC beta on Aztec Alpha, capped per payment. External audit began 25 Nov 2026, no report yet. Not affiliated with Aztec Labs or XMTP Labs.</text>
</svg>
